[project]
name = "wadtf"
version = "1.0.0"
description = "Easy-to-use library to safely read, create, modify, and write WAD files"
readme = "README.md"
authors = [
    { name = "Butterroach", email = "butterroach@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []
scripts = { wadtf = "wadtf._cli:main" }
license = "Apache-2.0"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
